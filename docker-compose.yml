services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Redis REST API (Upstash-compatible)
  redis-rest:
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: e2e-test-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      - redis

volumes:
  redis_data:
